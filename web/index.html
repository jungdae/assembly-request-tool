<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국회 요구자료 대응</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --line: #d8dde6;
      --text: #1d2733;
      --muted: #647084;
      --accent: #0f6b5f;
      --accent-weak: #e5f3f0;
      --warn: #8a5a00;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      letter-spacing: 0;
    }
    header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 700; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    nav a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--white);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    nav a.active { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); font-weight: 700; }
    main { padding: 24px; max-width: 1180px; margin: 0 auto; }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 92px;
    }
    .metric strong { display: block; font-size: 28px; margin-top: 8px; }
    .metric span { color: var(--muted); font-size: 13px; }
    section {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    h2 { margin: 0 0 12px; font-size: 17px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 700; background: #fafbfc; }
    .empty { color: var(--muted); padding: 18px 0; }
    .actions { margin-top: 16px; display: flex; gap: 8px; }
    button, .button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    button.secondary, .button.secondary { background: var(--white); color: var(--accent); }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      main { padding: 14px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>국회 요구자료 대응</h1>
    <nav>
      <a class="active" href="index.html">시작 화면</a>
      <a href="assign.html">배분</a>
      <a href="#" aria-disabled="true">현업 회신</a>
      <a href="#" aria-disabled="true">취합</a>
    </nav>
  </header>
  <main>
    <div class="summary">
      <div class="metric"><span>전체 문항</span><strong data-total>0</strong></div>
      <div class="metric"><span>접수</span><strong data-received>0</strong></div>
      <div class="metric"><span>배분확정</span><strong data-assigned>0</strong></div>
      <div class="metric"><span>확인필요</span><strong data-review>0</strong></div>
    </div>
    <section>
      <h2>최근 접수 문항</h2>
      <div data-recent></div>
      <div class="actions">
        <a class="button" href="assign.html">배분 화면 열기</a>
        <button class="secondary" type="button" data-clear>브라우저 저장 비우기</button>
      </div>
    </section>
  </main>
  <script src="common.js"></script>
  <script>
    const cases = Common.readCases();
    document.querySelector("[data-total]").textContent = cases.length;
    document.querySelector("[data-received]").textContent = cases.filter((item) => item.상태 === "접수").length;
    document.querySelector("[data-assigned]").textContent = cases.filter((item) => item.상태 === "배분확정").length;
    document.querySelector("[data-review]").textContent = cases.filter((item) => item.상태 === "확인필요").length;

    const recent = cases.slice(-8).reverse();
    const target = document.querySelector("[data-recent]");
    if (!recent.length) {
      target.innerHTML = '<p class="empty">저장된 문항이 없습니다.</p>';
    } else {
      target.innerHTML = `<table><thead><tr><th>상태</th><th>의원·문항</th><th>요구내용</th><th>주관 과</th></tr></thead><tbody>${recent.map((item) => `
        <tr>
          <td>${Common.escapeHtml(item.상태)}</td>
          <td>${Common.escapeHtml(item.의원)}-${Common.escapeHtml(item.문항번호)}</td>
          <td>${Common.escapeHtml(item.요구내용)}</td>
          <td>${Common.escapeHtml(item.주관과 || "")}</td>
        </tr>`).join("")}</tbody></table>`;
    }

    document.querySelector("[data-clear]").addEventListener("click", () => {
      if (!confirm("브라우저에 저장된 접수·배분 기록을 지울까요?")) return;
      Common.clearCases();
      location.reload();
    });
  </script>
</body>
</html>
